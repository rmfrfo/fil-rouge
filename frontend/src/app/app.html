<a class="skip-link" href="#contenu">Aller au contenu principal</a>

<div class="app" [class.app--nav-open]="navOpen()">
  <app-topbar
    [user]="currentUser"
    initials="CM"
    [navOpen]="navOpen()"
    (menuToggle)="toggleNav()"
    appName="TechCorp"
  />

  <app-sidebar />

  <main class="app__main" id="contenu" tabindex="-1">
    <div class="container">
      <div class="page-header">
        <div>
          <h1>Bonjour {{ currentUser.firstName }}</h1>
          <p class="page-header__subtitle">Résumé de votre activité au {{ currentDate }}</p>
        </div>
      </div>
      <section class="card" aria-labelledby="titre-prochain-conge">
        <h2 id="titre-prochain-conge">Prochain congé</h2>
        <p>{{ nextLeaveType }} du {{ nextLeave.startDate }} au {{ nextLeave.endDate }}</p>
        <app-status-badge [status]="nextLeave.status" />
      </section>
      <ul class="grid-auto list" role="list">
        <li>
          <app-stat-card label="Congés payés restants" [value]="10" unit="jours" [max]="25" />
        </li>
        <li><app-stat-card label="RTT restants" [value]="6" unit="jours" /></li>
      </ul>

      <router-outlet />
    </div>
  </main>
</div>
