<a class="skip-link" href="#contenu">Aller au contenu principal</a>

<div class="app" [class.app--nav-open]="navOpen()">
  <header class="app__header topbar">
    <button
      class="topbar__menu"
      type="button"
      [attr.aria-expanded]="navOpen()"
      (click)="toggleNav()"
      aria-expanded="false"
      aria-controls="navigation"
    >
      <svg
        class="nav__icon"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        aria-hidden="true"
        focusable="false"
      >
        <path d="M4 6h16M4 12h16M4 18h16" />
      </svg>
      <span class="sr-only">Ouvrir le menu</span>
    </button>

    <a class="brand" href="dashboard-employe.html">
      <img class="brand__logo" src="logo.svg" alt="" width="32" height="32" />
      {{ appName }}
    </a>

    <div class="topbar__actions">
      <div class="user">
        <a href="#" class="icon-link">
          <svg xmlns="http://www.w3.org/2000/svg" width="2em" height="2em" viewBox="0 0 24 24">
            <path d="M0 0h24v24H0z" fill="none" />
            <path
              fill="currentColor"
              d="M10 21h4c0 1.1-.9 2-2 2s-2-.9-2-2m11-2v1H3v-1l2-2v-6c0-3.1 2-5.8 5-6.7V4c0-1.1.9-2 2-2s2 .9 2 2v.3c3 .9 5 3.6 5 6.7v6zm-4-8c0-2.8-2.2-5-5-5s-5 2.2-5 5v7h10z"
            />
          </svg>
        </a>
        <span class="avatar" aria-hidden="true">CM</span>
        <div class="user__info">
          <p class="user__name">{{ userName() }}</p>
          <p class="user__role">Développeuse</p>
        </div>
        <a href="login.html" class="icon-link">
          <svg xmlns="http://www.w3.org/2000/svg" width="2em" height="2em" viewBox="0 0 24 24">
            <path d="M0 0h24v24H0z" fill="none" />
            <path
              fill="currentColor"
              d="m17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5M4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4z"
            />
          </svg>
        </a>
      </div>
    </div>
  </header>

  <nav class="app__sidebar sidebar" id="navigation" aria-label="Navigation principale">
    <div class="nav__section">
      <h2 class="nav__heading" id="nav-perso">Mon espace</h2>
      <ul class="nav" role="list" aria-labelledby="nav-perso">
        <li>
          <a class="nav__link" href="dashboard-employe.html" aria-current="page">
            <img src="icons/mdi--view-dashboard.svg" alt="Icone dashboard" />Tableau de bord</a
          >
        </li>
        <li>
          <a class="nav__link" href="conges-demande.html">Mes congés</a>
        </li>
        <li>
          <a class="nav__link" href="note-frais-nouvelle.html">Notes de frais</a>
        </li>
        <li><a class="nav__link" href="materiel.html">Matériel</a></li>
        <li><a class="nav__link" href="profil.html">Mon profil</a></li>
      </ul>
    </div>
  </nav>

  <main class="app__main" id="contenu" tabindex="-1">
    <div class="container">
      <div class="page-header">
        <div>
          <h1>Bonjour {{ userName() }}</h1>
          <p class="page-header__subtitle">Résumé de votre activité au {{ currentDate }}</p>
        </div>
      </div>

      <router-outlet />
    </div>
  </main>
</div>
